services:
  # Backend Service
  - type: web
    name: ai-sql-query-generator-b
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    rootDir: Backend_Part
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://ai-sql-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://ai-sql-frontend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_SECRET
        sync: false

  # Frontend Service
  - type: web
    name: ai-sql-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: Frontend_Part
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ai-sql-query-generator-b.onrender.com/api
      - key: VITE_GOOGLE_AUTH_URL
        value: https://ai-sql-query-generator-b.onrender.com/api/auth/google
